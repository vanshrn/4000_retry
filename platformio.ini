; ============================================================
; SWET_IOT - PlatformIO Project Configuration
; Target: Seeed Studio XIAO ESP32S3 + ProtoCentral ADS1292R Breakout v3.1
; Firmware v10.0 - Full ECG Pipeline Port from Arduino v10.0
; ============================================================

[env:seeed_xiao_esp32s3]
platform    = espressif32
board       = seeed_xiao_esp32s3
framework   = arduino

; --- Serial Monitor ---
monitor_speed = 115200

; --- Upload ---
upload_speed  = 921600

; --- Build Unflags (remove default 8KB loop stack size) ---
build_unflags =
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; --- Build Flags ---
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -Wall
    ; Increase Arduino loopTask stack size to 48KB for 2000-sample payloads
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=49152
    ; Needed for M_PI in math.h on some toolchain versions
    -D _USE_MATH_DEFINES
    ; Required by WiFiManager
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    ; Required for ESP32-S3 USB CDC Serial monitor over native USB
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; Enable PSRAM (8 MB OPI PSRAM on XIAO ESP32S3) for large JSON buffers
    -D BOARD_HAS_PSRAM
    ; Allow EXT_RAM_BSS_ATTR to place large static arrays in PSRAM BSS segment
    ; This is what makes EXT_RAM_BSS_ATTR work for g_buffers, g_analysisWindow, etc.
    -D CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=1

; Enable OPI PSRAM on XIAO ESP32S3
board_build.arduino.memory_type = qio_opi

; --- Source directories ---
; PlatformIO automatically includes src/ and any subdirs in src/.
; No extra src_filter needed.

; --- Library Dependencies ---
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^1.4.1
    electroniccats/MPU6050 @ ^1.4.1
    links2004/WebSockets @ ^2.4.1

